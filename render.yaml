services:
  # Static Web Frontend
  - type: web
    name: lucid-web
    env: static
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter "./packages/*" build && pnpm --filter lucid-web build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: lucid-api
          property: host

  # Realtime Gateway & REST API
  - type: web
    name: lucid-api
    env: node
    plan: free
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter "./packages/*" build && pnpm --filter lucid-api build
    startCommand: node apps/api/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_ORIGIN
        value: "*"
      - key: MONGODB_DB_NAME
        value: lucid
      - key: MONGODB_URI
        sync: false
